```html
<!DOCTYPE html>
<html>

<head>
    <title>Edit Job Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card form-card">

        <h1>Edit Job Application</h1>

        <form method="POST">

            <label>Company:</label>
            <input
                type="text"
                name="company"
                value="{{ application.company }}"
                required
            >

            <label>Role:</label>
            <input
                type="text"
                name="role"
                value="{{ application.role }}"
                required
            >

            <label>Location:</label>
            <input
                type="text"
                name="location"
                value="{{ application.location }}"
            >

            <label>Application Date:</label>
            <input
                type="date"
                name="application_date"
                value="{{ application.application_date }}"
                required
            >

            <label>Status:</label>
            <select name="status" required>

                <option value="Applied"
                    {% if application.status == "Applied" %}selected{% endif %}>
                    Applied
                </option>

                <option value="Interview"
                    {% if application.status == "Interview" %}selected{% endif %}>
                    Interview
                </option>

                <option value="Selected"
                    {% if application.status == "Selected" %}selected{% endif %}>
                    Selected
                </option>

                <option value="Rejected"
                    {% if application.status == "Rejected" %}selected{% endif %}>
                    Rejected
                </option>

            </select>

            <label>Salary / CTC:</label>
            <input
                type="number"
                name="salary"
                value="{{ application.salary }}"
            >

            <label>Source:</label>
            <input
                type="text"
                name="source"
                value="{{ application.source }}"
            >

            <label>Interview Date:</label>
            <input
                type="date"
                name="interview_date"
                value="{{ application.interview_date or '' }}"
            >

            <label>Notes:</label>
            <textarea
                name="notes"
                rows="4"
                placeholder="Add notes about this application"
            >{{ application.notes or '' }}</textarea>

            <button type="submit">Update Application</button>

        </form>

        <p class="form-link">
            <a href="{{ url_for('applications') }}">
                ← Back to My Applications
            </a>
        </p>

    </div>

</div>

</body>
</html>
```
