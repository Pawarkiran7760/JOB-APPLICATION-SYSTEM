```html
<!DOCTYPE html>
<html>
<head>
    <title>Add Job Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card form-card">

        <h1>Add Job Application</h1>

        <form method="POST">

            <label>Company:</label>
            <input type="text" name="company" placeholder="e.g. Dell" required>

            <label>Role:</label>
            <input type="text" name="role" placeholder="e.g. Python Developer" required>

            <label>Location:</label>
            <input type="text" name="location" placeholder="e.g. Bengaluru">

            <label>Application Date:</label>
            <input type="date" name="application_date" required>

            <label>Status:</label>
            <select name="status" required>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Selected">Selected</option>
                <option value="Rejected">Rejected</option>
            </select>

            <label>Salary / CTC:</label>
            <input type="number" name="salary" placeholder="e.g. 600000">

            <label>Source:</label>
            <input type="text" name="source" placeholder="e.g. LinkedIn, Company Website">

            <label>Interview Date:</label>
            <input type="date" name="interview_date">

            <label>Notes:</label>
            <textarea name="notes" rows="4" placeholder="Add any notes about this application"></textarea>

            <button type="submit">Add Application</button>

        </form>

        <p class="form-link">
            <a href="{{ url_for('applications') }}">← Back to My Applications</a>
        </p>

    </div>

</div>

</body>
</html>
```
